<!DOCTYPE html>
<!-- © جميع الحقوق محفوظة لـ مربع الخدمات ش.م.م -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="لوحة تحكم إدارة الشاحنات والمعدات – الماسية الدولية للمعدات ش.م.م">
  <meta name="author" content="مربع الخدمات ش.م.م – Services Square LLC">
  <meta name="copyright" content="© مربع الخدمات ش.م.م – جميع الحقوق محفوظة">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1f33">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أسطول الماسية">
  <meta name="format-detection" content="telephone=no">
  <title>نظام إدارة الأسطول والمعدات</title>
  <link rel="icon" id="favicon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="login-screen" class="login hidden"></div>

  <!-- التطبيق -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <img class="brand-logo" id="brandLogo" src="assets/logo.svg" alt="الشعار">
        <div class="brand-text">
          <strong id="brandSystem"></strong>
          <small id="brandCompany"></small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-account" id="sidebarAccount"></div>
      <div class="sidebar-foot">
        <span id="appVersion"></span>
        <span id="copyrightLine"></span>
      </div>
    </aside>
    <div class="backdrop" id="backdrop" data-action="close-sidebar"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="القائمة"></button>
        <div class="topbar-title">
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions">
          <span class="today" id="todayLabel"></span>
          <button class="lang-btn" data-action="lang-toggle" id="langBtn" title="English / عربي" aria-label="English / عربي"></button>
          <button class="icon-btn bell" id="alertsBtn" data-action="show-alerts" aria-label="التنبيهات"></button>
          <div class="user-chip" id="userChip"></div>
          <button class="icon-btn" id="pwBtn" data-action="change-password" title="تغيير كلمة المرور" aria-label="تغيير كلمة المرور"></button>
          <button class="icon-btn" id="logoutBtn" data-action="logout" title="تسجيل الخروج" aria-label="تسجيل الخروج"></button>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="التنقل السريع"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
