# بناء تطبيق أندرويد (APK) تلقائياً مع كل تحديث، ونشره في صفحة Releases.
# التوقيع: إن وُجد السرّان ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD
# يُوقَّع التطبيق بمفتاح ثابت (تعمل التحديثات فوق النسخة المثبتة)، وإلا يُبنى بمفتاح تجريبي.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # الـ Android SDK مثبت مسبقاً على خوادم GitHub؛ نضيف فقط حزم Android 16 (SDK 36)
      - name: Android SDK 36 packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Copy web app into the Android project
        working-directory: mobile
        run: npm run prepare-www

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Generate app icon and splash screen
        working-directory: mobile
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#0f4c81' --iconBackgroundColorDark '#0f4c81'
          --splashBackgroundColor '#0b1f33' --splashBackgroundColorDark '#0b1f33'

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No signing secrets found — building a debug-signed APK (updates will require reinstalling)."
          fi

      - name: Configure Android project (version, signing, edge-to-edge, camera)
        working-directory: mobile
        run: npm run configure-android

      - name: Sync plugins
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: almasiya
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/almasiya-fleet.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/almasiya-fleet.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/almasiya-fleet.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: almasiya-fleet-apk
          path: almasiya-fleet.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: أسطول الماسية – أندرويد ${{ env.VERSION_NAME }}
          make_latest: true
          files: almasiya-fleet.apk
          body: |
            تطبيق أندرويد لنظام إدارة الأسطول والمعدات – الماسية الدولية للمعدات ش.م.م
            مُحسّن لهاتف Samsung Galaxy S26 Ultra (Android 16 / One UI 8.5) ويعمل على Android 7 فأحدث.

            **التثبيت:** نزّل الملف `almasiya-fleet.apk` على الهاتف وافتحه، ثم اسمح بالتثبيت من هذا المصدر عند الطلب.

