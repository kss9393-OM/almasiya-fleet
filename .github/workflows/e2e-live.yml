# اختبار حيّ مؤقت للمزامنة مع قاعدة البيانات (يُحذف بعد التحقق)
name: Live sync test
on:
  push:
    branches: [main]
    paths: ['tests/**', '.github/workflows/e2e-live.yml']
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - name: Run live test
        env:
          QA_PASSWORD: Qa2CX0S5gSvW8P6mTYD97
        run: node tests/e2e-live.mjs
